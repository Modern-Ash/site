<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ModernAsh Favicon - Flame Symbol -->
  <rect width="64" height="64" fill="#f8fafc"/>

  <!-- Llama corporativa - tres formas fluidas ascendentes -->
  <g transform="translate(16, 10)">
    <!-- Llama izquierda -->
    <path d="M 5 38
             C 3 34, 2 28, 4 24
             C 6 20, 8 18, 10 20
             C 12 22, 12 26, 10 30
             C 8 34, 6 36, 5 38 Z"
          fill="#3d4a54"/>

    <!-- Llama central (más alta y prominente) -->
    <path d="M 16 40
             C 14 36, 12 28, 14 20
             C 16 12, 18 6, 20 8
             C 22 10, 22 18, 20 26
             C 18 34, 17 38, 16 40 Z"
          fill="#2d3a44"/>

    <!-- Llama derecha -->
    <path d="M 27 38
             C 25 34, 23 28, 25 24
             C 27 20, 29 18, 31 20
             C 33 22, 33 26, 31 30
             C 29 34, 28 36, 27 38 Z"
          fill="#475869"/>

    <!-- Detalles internos -->
    <path d="M 16 34
             C 15 30, 14 24, 16 18
             C 17 24, 17 30, 16 34 Z"
          fill="#404d59"
          opacity="0.5"/>
  </g>
</svg>
